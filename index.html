<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal Digital World - Portfolio">
  <title>My Digital World</title>

  <style>
    /* ========================================
       RESET & VARIABLES
    ======================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue-pastel: #a9d8f5;
      --blue-light: #dff3ff;
      --blue-dark: #5b9bd5;

      --pink-pastel: #f7b8d6;
      --pink-light: #ffe5f0;
      --pink-dark: #d987ae;

      --purple: #c7b9ef;

      --white: #ffffff;
      --text: #344054;
      --text-light: #667085;
      --border: rgba(255, 255, 255, 0.65);

      --shadow:
        0 20px 50px rgba(82, 117, 150, 0.15);

      --window-shadow:
        0 25px 70px rgba(66, 91, 120, 0.25);

      --radius: 22px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(169, 216, 245, 0.9), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(247, 184, 214, 0.85), transparent 28%),
        radial-gradient(circle at 75% 85%, rgba(199, 185, 239, 0.6), transparent 30%),
        linear-gradient(135deg, #f5fbff, #fff4f9);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ========================================
       BACKGROUND
    ======================================== */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(5px);
      opacity: 0.5;
    }

    .blob-1 {
      width: 350px;
      height: 350px;
      top: -120px;
      left: -100px;
      background: var(--blue-pastel);
    }

    .blob-2 {
      width: 300px;
      height: 300px;
      right: -80px;
      top: 100px;
      background: var(--pink-pastel);
    }

    .blob-3 {
      width: 400px;
      height: 400px;
      bottom: -180px;
      left: 35%;
      background: var(--purple);
    }

    /* ========================================
       BOOT SCREEN
    ======================================== */

    .boot-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          #dff3ff,
          #ffe5f0,
          #e8e1ff
        );
      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
    }

    .boot-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-content {
      width: min(90%, 420px);
      text-align: center;
    }

    .boot-logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      font-size: 40px;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: var(--shadow);
    }

    .boot-content h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .boot-content p {
      color: var(--text-light);
      margin-bottom: 25px;
    }

    .loading-bar {
      width: 100%;
      height: 9px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255,255,255,0.65);
    }

    .loading-progress {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        var(--blue-dark),
        var(--pink-dark)
      );
      animation: loading 2.2s ease forwards;
    }

    @keyframes loading {
      to {
        width: 100%;
      }
    }

    /* ========================================
       DESKTOP
    ======================================== */

    .desktop {
      position: fixed;
      inset: 0;
      min-height: 100vh;
      padding: 35px;
      transition: opacity 0.5s ease;
    }

    .desktop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .desktop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .welcome-text h1 {
      font-size: clamp(28px, 4vw, 52px);
      letter-spacing: -2px;
      color: #344054;
    }

    .welcome-text p {
      margin-top: 7px;
      color: var(--text-light);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 16px;
      border-radius: 50px;
      background: rgba(255,255,255,0.6);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
      font-size: 14px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #6dd68c;
      box-shadow: 0 0 12px #6dd68c;
    }

    /* ========================================
       PROFILE CARD
    ======================================== */

    .profile-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(440px, 90%);
      padding: 35px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: rgba(255,255,255,0.48);
      backdrop-filter: blur(30px);
      box-shadow: var(--shadow);
    }

    .photo-frame {
      width: 150px;
      height: 150px;
      margin: 0 auto 22px;
      padding: 7px;
      border-radius: 50%;
      background:
        linear-gradient(
          135deg,
          var(--blue-dark),
          var(--pink-dark),
          var(--purple)
        );
      box-shadow:
        0 15px 35px rgba(91,155,213,0.2),
        0 15px 35px rgba(217,135,174,0.18);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid rgba(255,255,255,0.9);
      background: var(--blue-light);
    }

    .profile-card h2 {
      font-size: 29px;
      margin-bottom: 5px;
    }

    .profile-card .role {
      color: var(--blue-dark);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .profile-card .description {
      color: var(--text-light);
      line-height: 1.6;
      font-size: 14px;
    }

    /* ========================================
       DESKTOP ICONS
    ======================================== */

    .desktop-icons {
      position: absolute;
      top: 150px;
      left: 40px;
      display: grid;
      gap: 18px;
    }

    .desktop-icon {
      width: 92px;
      padding: 10px 7px;
      border: 0;
      border-radius: 16px;
      color: var(--text);
      background: transparent;
      transition: 0.25s ease;
    }

    .desktop-icon:hover {
      background: rgba(255,255,255,0.45);
      transform: translateY(-3px);
    }

    .icon-box {
      width: 58px;
      height: 58px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      font-size: 27px;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 10px 25px rgba(70,90,120,0.1);
    }

    .desktop-icon span:last-child {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ========================================
       TASKBAR
    ======================================== */

    .taskbar {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 5000;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px;
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 22px;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(25px);
      box-shadow: 0 15px 45px rgba(60,80,110,0.15);
    }

    .taskbar-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      font-size: 20px;
      transition: 0.2s ease;
    }

    .taskbar-button:hover {
      background: rgba(255,255,255,0.8);
      transform: translateY(-2px);
    }

    .taskbar-divider {
      width: 1px;
      height: 28px;
      background: rgba(52,64,84,0.15);
    }

    .clock {
      padding: 0 10px;
      font-size: 13px;
      color: var(--text-light);
      white-space: nowrap;
    }

    /* ========================================
       WINDOWS
    ======================================== */

    .window {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 2000;
      width: min(700px, calc(100% - 40px));
      max-height: 75vh;
      overflow: hidden;
      display: none;
      flex-direction: column;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 22px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(30px);
      box-shadow: var(--window-shadow);
    }

    .window.active {
      display: flex;
      animation: windowOpen 0.25s ease;
    }

    @keyframes windowOpen {
      from {
        opacity: 0;
        transform: translate(-50%, -48%) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      cursor: move;
      user-select: none;
      background: rgba(255,255,255,0.5);
      border-bottom: 1px solid rgba(52,64,84,0.08);
    }

    .window-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    .window-controls {
      display: flex;
      gap: 7px;
    }

    .window-control {
      width: 12px;
      height: 12px;
      padding: 0;
      border: 0;
      border-radius: 50%;
    }

    .close {
      background: #f29ab9;
    }

    .minimize {
      background: #f5ca77;
    }

    .window-body {
      padding: 28px;
      overflow-y: auto;
    }

    .window-body h2 {
      margin-bottom: 12px;
      font-size: 25px;
    }

    .window-body p {
      color: var(--text-light);
      line-height: 1.7;
    }

    /* ========================================
       ABOUT
    ======================================== */

    .about-grid {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 30px;
      align-items: center;
    }

    .small-profile {
      width: 160px;
      height: 160px;
      padding: 5px;
      border-radius: 28px;
      background: linear-gradient(
        135deg,
        var(--blue-dark),
        var(--pink-dark)
      );
    }

    .small-profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 24px;
      border: 4px solid white;
    }

    .info-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 15px;
      border-radius: 12px;
      background: rgba(223,243,255,0.5);
      font-size: 14px;
    }

    .info-item strong {
      color: var(--text);
    }

    .info-item span {
      color: var(--text-light);
    }

    /* ========================================
       PROJECTS
    ======================================== */

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .project-card {
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        rgba(223,243,255,0.7),
        rgba(255,229,240,0.7)
      );
      transition: 0.25s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(70,90,120,0.1);
    }

    .project-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border-radius: 14px;
      font-size: 22px;
      background: rgba(255,255,255,0.8);
    }

    .project-card h3 {
      margin-bottom: 7px;
      font-size: 17px;
    }

    .project-card p {
      font-size: 13px;
      line-height: 1.5;
    }

    .tech {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 13px;
    }

    .tech span {
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 10px;
      background: rgba(255,255,255,0.7);
      color: var(--text-light);
    }

    /* ========================================
       SKILLS
    ======================================== */

    .skill {
      margin-bottom: 20px;
    }

    .skill-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .skill-header span:last-child {
      color: var(--text-light);
    }

    .skill-bar {
      height: 10px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(91,155,213,0.12);
    }

    .skill-progress {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        var(--blue-dark),
        var(--pink-dark)
      );
    }

    /* ========================================
       TERMINAL
    ======================================== */

    .terminal {
      min-height: 330px;
      padding: 22px;
      border-radius: 16px;
      background: #182230;
      color: #dff3ff;
      font-family: "Courier New", monospace;
      font-size: 13px;
      line-height: 1.8;
    }

    .terminal-output {
      min-height: 250px;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .terminal-line {
      display: flex;
      gap: 8px;
    }

    .terminal-prompt {
      color: #9ee6b3;
    }

    .terminal-input {
      flex: 1;
      border: 0;
      outline: 0;
      color: white;
      background: transparent;
    }

    /* ========================================
       CONTACT
    ======================================== */

    .contact-list {
      display: grid;
      gap: 12px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border-radius: 15px;
      background: linear-gradient(
        90deg,
        rgba(223,243,255,0.65),
        rgba(255,229,240,0.65)
      );
    }

    .contact-icon {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      background: white;
      font-size: 20px;
    }

    .contact-item h3 {
      font-size: 14px;
      margin-bottom: 3px;
    }

    .contact-item p {
      font-size: 13px;
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 700px) {

      body {
        overflow: auto;
      }

      .desktop {
        position: relative;
        min-height: 100vh;
        padding: 22px;
        padding-bottom: 100px;
      }

      .desktop-header {
        align-items: flex-start;
      }

      .welcome-text h1 {
        font-size: 30px;
      }

      .status {
        display: none;
      }

      .desktop-icons {
        position: relative;
        top: auto;
        left: auto;
        margin-top: 30px;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .desktop-icon {
        width: 100%;
      }

      .profile-card {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        width: 100%;
        margin-top: 35px;
        padding: 28px 20px;
      }

      .taskbar {
        bottom: 10px;
        width: calc(100% - 20px);
        justify-content: center;
      }

      .taskbar-button {
        width: 38px;
        height: 38px;
      }

      .clock {
        display: none;
      }

      .window {
        width: calc(100% - 20px);
        max-height: 80vh;
      }

      .window-body {
        padding: 20px;
      }

      .about-grid {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .small-profile {
        margin: auto;
      }

      .info-item {
        text-align: left;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- ======================================
       BACKGROUND
  ======================================= -->

  <div class="background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- ======================================
       BOOT SCREEN
  ======================================= -->

  <section class="boot-screen" id="bootScreen">

      </div>

      <h1>My Digital World</h1>

      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>

    </div>
  </section>

  <!-- ======================================
       DESKTOP
  ======================================= -->

  <main class="desktop hidden" id="desktop">

      <div class="welcome-text">
        <h1>Welcome 👋</h1>
        <p>Welcome to my digital space.</p>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        <span>Available for work</span>
      </div>

    </header>

    <!-- ====================================
         DESKTOP ICONS
    ===================================== -->

    <div class="desktop-icons">

      <button
        class="desktop-icon"

      >

      </button>

      <button
        class="desktop-icon"
        data-window="projectsWindow"
      >
        <div class="icon-box">📁</div>
        <span>Projects</span>
      </button>

      <button
        class="desktop-icon"
        data-window="skillsWindow"
      >
        <div class="icon-box">🧠</div>
        <span>Skills</span>
      </button>

      <button
        class="desktop-icon"
        data-window="terminalWindow"
      >
        <div class="icon-box">💻</div>
        <span>Terminal</span>
      </button>

      <button
        class="desktop-icon"
        data-window="contactWindow"
      >
        <div class="icon-box">✉️</div>

    </div>

    <!-- ====================================
         PROFILE
    ===================================== -->

    <section class="profile-card">

      <div class="photo-frame">

        <!-- GANTI URL GAMBAR INI -->

          src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=500&q=80"
          alt="Foto Profil"
        >

      </div>

      <h2>Your Name</h2>

      <div class="role">
        Web Developer
      </div>

        I create modern, interactive and meaningful

    </section>

  </main>

  <!-- ======================================
       ABOUT WINDOW
  ======================================= -->

  <section class="window" id="aboutWindow">

    <div class="window-header">

      <div class="window-title">
        👤 About Me
      </div>

      <div class="window-controls">

        <button
          class="win
